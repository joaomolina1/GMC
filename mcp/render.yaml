services:
  - type: web
    name: gmc-mcp
    runtime: node
    rootDir: mcp
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: GMC_API_URL
        sync: false
      - key: GMC_API_KEY
        sync: false
      - key: MCP_AUTH_TOKEN
        sync: false
